# ИИ-консультант Store — запуск в Docker
#
#   docker compose up --build                      → http://localhost:8080  (сервер на Go + фронтенд, как на Railway)
#   docker compose --profile dev up                → http://localhost:5173  (разработка с горячей перезагрузкой)
#   docker compose --profile tools run --rm catalog  → пересобрать каталог из фида и переписки

name: support-assistant

services:
  # Итоговое приложение: один контейнер — API, WebSocket и собранный фронтенд
  app:
    build: .
    environment:
      ALLOW_RESET: ${ALLOW_RESET:-false}
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-app}@db:5432/support
      # Первый администратор — создаётся, только пока в базе нет сотрудников (см. .env.example)
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_NAME: ${ADMIN_NAME:-Администратор}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Postgres: сотрудники кабинета и их сессии
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: support
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d support"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ── Разработка ──────────────────────────────────────────────────────
  # Сервер на Go из исходников. После правок в backend/: docker compose --profile dev restart api-dev
  api-dev:
    profiles: [dev]
    image: golang:1.23-alpine
    working_dir: /app/backend
    command: go run .
    environment:
      PORT: 8000
      PUBLIC_DIR: /nonexistent
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-app}@db:5432/support
      ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
      ADMIN_NAME: ${ADMIN_NAME:-Администратор}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ALLOW_RESET: ${ALLOW_RESET:-false}
    volumes:
      - ./:/app
      - go_cache:/go
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Фронтенд с горячей перезагрузкой; /api проксируется в api-dev
  dev:
    profiles: [dev]
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5173 --strictPort"
    environment:
      API_PROXY: http://api-dev:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - dev_node_modules:/app/node_modules
    ports:
      - "${DEV_PORT:-5173}:5173"
    depends_on:
      - api-dev

  # ── Утилиты ─────────────────────────────────────────────────────────
  # Каталог из фида Mindbox.yml.gz.xml и выжимка из «чаты поддержки»
  catalog:
    profiles: [tools]
    build: ./data
    volumes:
      - ./:/work

volumes:
  db_data:
  go_cache:
  dev_node_modules:
